<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Members — Team Ojas Racing</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="shared.css" />
  <style>

    main {
      flex: 1;
      padding: clamp(1.2rem, 3.5vw, 2.5rem) clamp(1rem, 3.5vw, 2.5rem) 4rem;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Toolbar ─────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 200px;
      min-width: 180px;
      max-width: 320px;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #3f475c;
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      padding: 0.65rem 0.95rem 0.65rem 2.3rem;
      background: #0b0e15;
      border: 1px solid #1c2333;
      border-radius: 8px;
      color: #d5dae5;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      min-height: 42px;
      transition: all 0.18s ease;
      caret-color: #3d7ab8;
    }

    .search-wrap input:focus {
      border-color: #2b5d8f;
      box-shadow: 0 0 0 2px rgba(43, 93, 143, 0.15);
    }
    .search-wrap input::placeholder { color: #3c4457; }

    .btn-add {
      padding: 0.65rem 1.25rem;
      background: var(--color-gold-primary);
      border: 1px solid var(--color-gold-bright);
      border-radius: var(--radius-sharp);
      color: #08090c;
      font-size: 0.82rem;
      font-family: var(--font-racing);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 42px;
      transition: all 0.15s ease;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn-add:hover {
      background: var(--color-gold-bright);
      color: #000;
    }

    /* ── Members grid ────────────────────────────────────── */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
      gap: 1.2rem;
    }

    .member-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sharp);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      animation: fadeUp 0.35s ease both;
      transition: all 0.18s ease;
    }

    .member-card:hover {
      border-color: var(--color-border-strong);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .member-card-rule {
      height: 2px;
      background: var(--color-gold-primary);
    }

    .member-inner { padding: 1.4rem; }

    .member-avatar {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-sharp);
      background: var(--color-bg-panel);
      border: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--color-gold-bright);
      font-family: var(--font-racing);
      margin-bottom: 0.95rem;
      letter-spacing: 0.04em;
    }

    .member-name {
      font-size: 0.98rem;
      font-weight: 600;
      color: #e5e9f2;
      margin-bottom: 0.3rem;
    }

    .member-role {
      font-size: 0.76rem;
      color: #555f75;
      letter-spacing: 0.03em;
      margin-bottom: 1rem;
    }

    .member-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.85rem;
      border-top: 1px solid #151822;
      gap: 0.5rem;
    }

    .member-sub {
      font-size: 0.72rem;
      color: #404859;
      letter-spacing: 0.03em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-actions { display: flex; gap: 0.4rem; }

    .btn-icon {
      background: none;
      border: 1px solid #1c1f26;
      border-radius: 5px;
      color: #3a3f4a;
      padding: 0.28rem 0.45rem;
      cursor: pointer;
      font-size: 0.75rem;
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
    }

    .btn-icon:hover { border-color: #3a3f4a; color: #8a909c; }
    .btn-icon.del:hover { border-color: #5a3030; color: #b45252; }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      padding: 3.5rem 2rem;
      text-align: center;
      color: #2e3240;
      font-size: 0.85rem;
    }

    .empty-state svg { margin-bottom: 0.8rem; opacity: 0.3; display: block; margin-left: auto; margin-right: auto; }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.70);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #0d0f14;
      border: 1px solid #1c1f26;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      transform: translateY(10px);
      transition: transform 0.2s;
    }

    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-rule {
      height: 2px;
      background: linear-gradient(90deg, transparent, #2d5a8a 30%, #3d7ab8 50%, #2d5a8a 70%, transparent);
    }

    .modal-body { padding: 1.8rem; }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #d8dce4;
      margin-bottom: 1.4rem;
    }

    .field-group { margin-bottom: 1rem; }

    .field-group label {
      display: block;
      font-size: 0.68rem;
      font-weight: 500;
      color: #4b5060;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.38rem;
    }

    .field-group input,
    .field-group select {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: #090b0f;
      border: 1px solid #1c1f26;
      border-radius: 7px;
      color: #c8cdd6;
      font-size: 0.87rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.18s;
      caret-color: #3d7ab8;
    }

    .field-group input:focus,
    .field-group select:focus { border-color: #1e3a5a; }
    .field-group select option { background: #0d0f14; }

    .modal-actions {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.4rem;
    }

    .btn-confirm {
      flex: 1;
      padding: 0.7rem;
      background: var(--color-gold-primary);
      border: 1px solid var(--color-gold-bright);
      border-radius: var(--radius-sharp);
      color: #08090c;
      font-size: 0.82rem;
      font-family: var(--font-racing);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-confirm:hover { background: var(--color-gold-bright); color: #000; }

    .btn-cancel {
      padding: 0.7rem 1rem;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sharp);
      color: var(--color-text-muted);
      font-size: 0.82rem;
      font-family: var(--font-racing);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-cancel:hover { border-color: var(--color-border-strong); color: #ffffff; }

    /* Count strip */
    .count-strip {
      font-size: 0.7rem;
      color: #2e3240;
      letter-spacing: 0.08em;
      margin-bottom: 1.1rem;
    }

    .count-strip strong { color: #5a9acc; }

  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="header-logo" href="dashboard.html">
    <img src="logo.jpg" alt="Team Ojas Racing" />
    <span class="logo-wordmark">TEAM <span class="gold-text">OJAS</span> RACING</span>
  </a>
  <div class="nav-right">
    <nav class="header-nav-links">
      <a href="dashboard.html" class="nav-link-btn">Home</a>
      <a href="inventory.html" class="nav-link-btn">Inventory</a>
      <a href="restocking.html" class="nav-link-btn">Restocking</a>
      <a href="docs.html" class="nav-link-btn">Docs Vault</a>
      <a href="handbook.html" class="nav-link-btn">Handbook</a>
    </nav>
    <div class="user-pill">
      <div class="user-pill-dot"></div>
      <span id="js-nav-user">User</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</header>

<!-- PAGE HERO -->
<div class="page-hero">
  <span class="page-hero-tag">Module 02</span>
  <h2>Team Members</h2>
  <p>View and manage the Team Ojas Racing roster.</p>
</div>

<!-- MAIN -->
<main>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search members…" />
    </div>
    <button class="btn-add" onclick="openModal()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Member
    </button>
  </div>

  <div class="count-strip" id="count-strip">Loading…</div>

  <!-- Grid -->
  <div class="members-grid" id="members-grid"></div>

</main>

<!-- FOOTER -->
<footer>
  <div class="footer-left">&copy; <span id="js-year"></span> Team Ojas Racing &mdash; All rights reserved</div>
  <div class="footer-right">Inventory v1.0</div>
</footer>

<!-- MODAL -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-rule"></div>
    <div class="modal-body">
      <div class="modal-title" id="modal-title">Add Member</div>

      <div class="field-group">
        <label>Full Name</label>
        <input type="text" id="f-name" placeholder="e.g. Arjun Sharma" />
      </div>
      <div class="field-group">
        <label>Role / Designation</label>
        <input type="text" id="f-role" placeholder="e.g. Suspension Lead, Driver…" />
      </div>
      <div class="field-group">
        <label>Department / Sub-team</label>
        <input type="text" id="f-dept" placeholder="e.g. Chassis, Powertrain…" />
      </div>
      <div class="field-group">
        <label>Contact (optional)</label>
        <input type="text" id="f-contact" placeholder="Phone or email" />
      </div>

      <div class="modal-actions">
        <button class="btn-confirm" onclick="saveMember()">Save</button>
        <button class="btn-cancel"  onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ── Auth ──────────────────────────────────────────── */
  const loggedUser = sessionStorage.getItem('logged_in_user');
  if (!loggedUser) { window.location.href = 'index.html'; }
  document.getElementById('js-nav-user').textContent = loggedUser;
  document.getElementById('js-year').textContent     = new Date().getFullYear();
  function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }

  /* ── Data ──────────────────────────────────────────── */
  const STORE_KEY = 'ojas_team';
  let members = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  let editId  = null;

  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(members)); }

  function initials(name) {
    return name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
  }

  /* ── Render ────────────────────────────────────────── */
  function render(filter = '') {
    const grid  = document.getElementById('members-grid');
    const strip = document.getElementById('count-strip');
    const q     = filter.toLowerCase();
    const list  = members.filter(m =>
      m.name.toLowerCase().includes(q) ||
      m.role.toLowerCase().includes(q) ||
      m.dept.toLowerCase().includes(q)
    );

    strip.innerHTML = `<strong>${list.length}</strong> member${list.length !== 1 ? 's' : ''}`;
    grid.innerHTML  = '';

    if (list.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          No members yet. Click <strong>Add Member</strong> to get started.
        </div>`;
      return;
    }

    list.forEach((m, i) => {
      const card = document.createElement('div');
      card.className = 'member-card';
      card.style.animationDelay = `${i * 0.05}s`;
      card.innerHTML = `
        <div class="member-card-rule"></div>
        <div class="member-inner">
          <div class="member-avatar">${esc(initials(m.name))}</div>
          <div class="member-name">${esc(m.name)}</div>
          <div class="member-role">${esc(m.role || '—')}</div>
          <div class="member-meta">
            <div class="member-sub">${esc(m.dept || '—')}${m.contact ? ' · ' + esc(m.contact) : ''}</div>
            <div class="member-actions">
              <button class="btn-icon" onclick="editMember('${m.id}')" title="Edit">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="btn-icon del" onclick="deleteMember('${m.id}')" title="Remove">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              </button>
            </div>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Modal ─────────────────────────────────────────── */
  function openModal(id = null) {
    editId = id;
    document.getElementById('modal-title').textContent = id ? 'Edit Member' : 'Add Member';
    if (id) {
      const m = members.find(x => x.id === id);
      document.getElementById('f-name').value    = m.name;
      document.getElementById('f-role').value    = m.role;
      document.getElementById('f-dept').value    = m.dept;
      document.getElementById('f-contact').value = m.contact;
    } else {
      ['f-name','f-role','f-dept','f-contact'].forEach(id => {
        document.getElementById(id).value = '';
      });
    }
    document.getElementById('modal-backdrop').classList.add('open');
    document.getElementById('f-name').focus();
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    editId = null;
  }

  function saveMember() {
    const name    = document.getElementById('f-name').value.trim();
    const role    = document.getElementById('f-role').value.trim();
    const dept    = document.getElementById('f-dept').value.trim();
    const contact = document.getElementById('f-contact').value.trim();

    if (!name) { document.getElementById('f-name').focus(); return; }

    if (editId) {
      const m = members.find(x => x.id === editId);
      Object.assign(m, { name, role, dept, contact });
    } else {
      members.push({ id: Date.now().toString(), name, role, dept, contact });
    }

    save();
    render(document.getElementById('search-input').value);
    closeModal();
  }

  function editMember(id)   { openModal(id); }

  function deleteMember(id) {
    if (!confirm('Remove this member?')) return;
    members = members.filter(m => m.id !== id);
    save();
    render(document.getElementById('search-input').value);
  }

  /* ── Search ────────────────────────────────────────── */
  document.getElementById('search-input').addEventListener('input', e => render(e.target.value));

  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  });

  render();
</script>

</body>
</html>
